<!doctype html>
<html lang="zh">
  <head><meta charset="utf-8"><title>重远投资观-知识星球</title></head>
  <body>
    <app-root>
      <div class="topic-flow-container"><div class="flow-outlet"><app-main-content>
      <div class="main-content-container">
        <!-- 真实结构：分类标签栏也用 .topic-container，里面是 app-menu，不是帖子。 -->
        <div class="topic-container">
          <app-menu><div class="menu-container">
            <div class="item">最新</div><div class="item actived">精华</div>
            <div class="item">只看星主</div><div class="item">问答</div>
          </div></app-menu>
        </div>
        <!-- 帖子号不在 DOM 上（实测无链接、无 data-*、无长数字），靠接口响应对号。 -->
        <div class="topic-container">
          <div class="author-name">重远</div>
          <div class="talk-content-container"><div class="content">第一条帖子的正文内容，足够长以便通过长度校验判断。</div></div>
        </div>
        <div class="topic-container">
          <div class="talk-content-container"><div class="content">第二条帖子的正文内容，同样足够长以便通过长度校验。</div></div>
        </div>
        <!-- 接口里没有这一条，对不上号就如实跳过，绝不猜一个 id。 -->
        <div class="topic-container">
          <div class="talk-content-container"><div class="content">第三条帖子的正文内容，同样足够长以便通过长度校验。</div></div>
        </div>
      </div>
      </app-main-content></div></div>
    </app-root>
  </body>
</html>
