<!doctype html>
<html lang="zh">
  <head><meta charset="utf-8"><title>重远投资观-知识星球</title></head>
  <body>
    <app-root>
      <div class="index-container">
        <div class="main-content-container">
          <div class="topic-container" _ngcontent-abc>
            <!-- 真实结构（取自实机诊断）：作者名在 .author > .info > .role，
                 而点赞区的容器正好也叫 .name —— 裸 .name 会抓成点赞人名列表。 -->
            <app-topic-header>
              <div class="header-container">
                <div class="author">
                  <img class="avatar" src="https://images.zsxq.com/avatar.jpg">
                  <div class="info">
                    <div class="role owner">陈老师</div>
                    <div class="date"> 2026-07-20 09:12 </div>
                  </div>
                </div>
              </div>
            </app-topic-header>
            <div class="disabled-copy">
              <div class="talk-content-container">
                <div class="content">
                  创业板已经跌破 60 日线，机构在高位减仓 70~80%，这个位置要谨慎。
                  股价是业绩的期货不是现货，已经定价的增长会被当作新故事二次贩卖。
                  <img data-src="https://images.zsxq.com/chart.png" alt="趋势图" />
                </div>
              </div>
            </div>
            <!-- 点赞区：容器正好是 div.name，内容是一串人名。
                 作者选择器一旦退回裸 .name 就会抓中它（实测入库的 author 全是这串）。 -->
            <div class="like-user">
              <div class="name">百事可乐、何猪猪、The bright*、周荣海.jo、滕、雾中明眸、柳帆、</div>
              <span class="count"> 等18人点赞</span>
            </div>
            <div class="comments-container">
              <div class="moreComment ng-star-inserted">查看更多评论</div>
              <div class="comment">网友甲：谢谢老师</div>
            </div>
          </div>
        </div>
      </div>
    </app-root>
  </body>
</html>
